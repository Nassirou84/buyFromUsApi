framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache and every pool below are stored in Redis (REDIS_URL), shared by the API and the workers.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Namespaced pools use the above "app" backend by default
        pools:
            auth_codes.cache:
                adapter: cache.adapter.redis
                default_lifetime: 300 # 5 minutes default TTL
            settings.cache:
                adapter: cache.adapter.redis
                default_lifetime: 3600 # safety net; writes through Doctrine invalidate it immediately
            product_search.cache:
                adapter: cache.adapter.redis
                default_lifetime: 600 # search-as-you-type suggestions; new products show up within 10 minutes
            # Dedicated pool for every rate limiter / throttle (symfony/rate-limiter
            # factories, login_throttling, and the custom throttle services). Isolated
            # so counters can be flushed without touching the rest of the app cache.
            # No per-entry default_lifetime: each limiter sets its own window TTL.
            rate_limiter.cache:
                adapter: cache.adapter.redis

when@test:
    framework:
        cache:
            # Tests never need a Redis server; tests/Redis covers the real one when it is reachable.
            app: cache.adapter.array
            pools:
                auth_codes.cache:
                    adapter: cache.adapter.array
                settings.cache:
                    adapter: cache.adapter.array
                product_search.cache:
                    adapter: cache.adapter.array
                rate_limiter.cache:
                    adapter: cache.adapter.array
