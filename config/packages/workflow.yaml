framework:
    workflows: 
        order:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Order
            initial_marking: !php/const App\Enumeration\OrderStatusEnum::PLACED
            places:
                - !php/const App\Enumeration\OrderStatusEnum::PLACED
                - !php/const App\Enumeration\OrderStatusEnum::PROCESSED
                - !php/const App\Enumeration\OrderStatusEnum::IN_TRANSIT
                - !php/const App\Enumeration\OrderStatusEnum::ARRIVED_IN_FACILITY
                - !php/const App\Enumeration\OrderStatusEnum::OUT_FOR_DELIVERY
                - !php/const App\Enumeration\OrderStatusEnum::DELIVERED
                - !php/const App\Enumeration\OrderStatusEnum::CANCELLED
            transitions:
                processed_order:
                    from: !php/const App\Enumeration\OrderStatusEnum::PLACED
                    to: !php/const App\Enumeration\OrderStatusEnum::PROCESSED
                ship_order:
                    from: !php/const App\Enumeration\OrderStatusEnum::PROCESSED
                    to: !php/const App\Enumeration\OrderStatusEnum::IN_TRANSIT
                arrived_in_facility:
                    from: !php/const App\Enumeration\OrderStatusEnum::IN_TRANSIT
                    to: !php/const App\Enumeration\OrderStatusEnum::ARRIVED_IN_FACILITY
                out_for_delivery:
                    from: !php/const App\Enumeration\OrderStatusEnum::ARRIVED_IN_FACILITY
                    to: !php/const App\Enumeration\OrderStatusEnum::OUT_FOR_DELIVERY
                deliver_order:
                    from: !php/const App\Enumeration\OrderStatusEnum::OUT_FOR_DELIVERY
                    to: !php/const App\Enumeration\OrderStatusEnum::DELIVERED
                cancel_order:
                    from: [!php/const App\Enumeration\OrderStatusEnum::PLACED, !php/const App\Enumeration\OrderStatusEnum::PROCESSED, !php/const App\Enumeration\OrderStatusEnum::IN_TRANSIT, !php/const App\Enumeration\OrderStatusEnum::ARRIVED_IN_FACILITY, !php/const App\Enumeration\OrderStatusEnum::OUT_FOR_DELIVERY]
                    to: !php/const App\Enumeration\OrderStatusEnum::CANCELLED
