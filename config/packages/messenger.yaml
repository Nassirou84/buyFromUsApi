framework:
    messenger:
        failure_transport: failed

        transports:
            # Redis streams (MESSENGER_TRANSPORT_DSN=redis://host:6379); one stream per priority.
            # Keep the DSN free of a path: a "/path" in the DSN overrides the `stream` option below.
            # Run one worker per consumer name: set a unique `consumer` option if you scale workers out.
            async_priority_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: high
            async_default:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: default
            async_priority_low:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: low

            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            'App\Message\TwoFactorCodeMessage': async_priority_high
            'App\Message\ResetEmailMessage': async_priority_high
            'App\Message\NewAdminCreatedMessage': async_priority_high
            'App\Message\AdminResetLinkMessage': async_priority_high
            'App\Message\OrderConfirmationMessage': async_priority_high
            'App\Message\WelcomeMessage': async_default
            'App\Message\NewProductAddedMessage': async_priority_high

